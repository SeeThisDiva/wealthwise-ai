<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ww-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00c48c" />
      <stop offset="100%" stop-color="#41e0a6" />
    </linearGradient>
    <linearGradient id="ww-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00534f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00c48c" stop-opacity="0.2" />
    </linearGradient>
    <filter id="ww-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern Geometric Spire / Growth Waves -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#101726" stroke="#1e293b" stroke-width="1.5" />
  <!-- Dynamic Growth Curve 1 -->
  <path d="M12 34 C16 34, 18 26, 24 20 C28 16, 32 14, 36 14" stroke="url(#ww-grad-primary)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#ww-glow)" />
  <!-- Dynamic Growth Curve 2 (Overlapping) -->
  <path d="M12 26 C16 26, 18 20, 24 16 C28 13, 31 12, 36 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none" opacity="0.7" />
  <!-- Dynamic Node Accents -->
  <circle cx="36" cy="14" r="3.5" fill="#41e0a6" />
  <circle cx="24" cy="20" r="2.5" fill="#38bdf8" />
  <circle cx="12" cy="34" r="2.5" fill="#00c48c" />
</svg>
